name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      # Fresh clones have no src/botlab/ui display frontend (gitignored,
      # regenerated with `botlab ui sync`); tests must pass without it. The
      # CI builds an explicitly incomplete source wheel for install-contract
      # tests only. A real candidate wheel must pass scripts/verify_wheel.py
      # without --source-wheel and separate browser acceptance before upload.
      BOTLAB_ALLOW_MISSING_UI: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install package with dev extras
        run: |
          uv venv --clear
          uv pip install -e '.[dev]'

      - name: Lint
        run: uv run ruff check .

      - name: Test package and native runtime behavior
        run: |
          mkdir -p tmp
          uv run pytest --basetemp=tmp/pytest

      - name: Verify native processor parity with frozen browser traces
        run: uv run python -m botlab._runtime.golden_check tests/fixtures/processors.json

      - name: Verify non-editable source wheel contract (no UI; not a release gate)
        run: |
          uv build --wheel --out-dir tmp/source-wheel
          uv run --no-sync python scripts/verify_wheel.py tmp/source-wheel/*.whl --source-wheel --out tmp/source-wheel-check
