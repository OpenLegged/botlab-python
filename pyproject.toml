[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botlab-python"
version = "0.3.0"
description = "Python-first robot simulation and control in the browser."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "OpenLegged" }]
keywords = ["robotics", "mujoco", "onnx", "rl", "simulation", "sim2sim"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "PyYAML>=6.0",
  "rfc8785>=0.1.4,<0.2",
]

[project.urls]
Homepage = "https://github.com/OpenLegged/botlab-python"
Repository = "https://github.com/OpenLegged/botlab-python"

[project.scripts]
botlab = "botlab._cli:main"

[project.optional-dependencies]
# Native simulation via `botlab run`: native MuJoCo physics +
# onnxruntime inference (CPU out of the box; GPU needs onnxruntime-gpu with
# matching CUDA). Without these the CLI still compiles and packages projects.
runtime = [
  "numpy>=1.24",
  "mujoco>=3.2",
  "onnxruntime>=1.18",
  "websockets>=12",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "botlab-python[runtime]",
  # Enables the packaging-time ONNX asset validation in dev/CI; without it
  # botlab build packages model bytes as-is.
  "onnx>=1.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/botlab"]
# The gitignored UI snapshot contains only the pure Three.js native display.
# The editor/WASM runtime is a separate versioned archive cached on demand.
# The hook validates the viewer before inclusion; docs/ rides along as
# botlab/docs so local AI agents can read it after pip install.
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "scripts",
  "docs",
  "hatch_build.py",
  "README.md",
  "pyproject.toml",
]
[tool.hatch.build.targets.sdist.hooks.custom]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  # The vendored SDK mirrors BotLab's browser source; keep its style verbatim.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# The vendored SDK mirrors BotLab's browser source; keep its style verbatim.
"src/botlab/sdk/**" = ["E", "F", "W", "I", "UP", "B"]
# Native buffers intentionally zip to their shared width, matching the browser
# execution contract. Existing positional zip behavior is retained on migration.
"src/botlab/_runtime/_motion.py" = ["B905"]
"src/botlab/_runtime/_physics.py" = ["B007", "B905"]
"src/botlab/_runtime/_executor.py" = ["B007"]
"src/botlab/_runtime/_processors/_math.py" = ["B905"]
"src/botlab/_runtime/_processors/_model.py" = ["B905"]
"src/botlab/_runtime/_processors/_output.py" = ["B905"]
"src/botlab/_runtime/golden_check.py" = ["B905"]
"src/botlab/_runtime/mujoco_scene.py" = ["B905"]
# These tests exercise arbitrary display-thread failures and cleanup propagation.
"tests/runtime/test_display.py" = ["B017"]

[tool.pytest.ini_options]
markers = ["e2e: browser end-to-end acceptance tests"]
testpaths = ["tests"]
addopts = ["-q", "-m", "not e2e"]
