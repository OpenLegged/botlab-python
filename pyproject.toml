[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botlab-python"
version = "0.3.0"
description = "Python-first robot simulation and control in the browser."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "OpenLegged" }]
keywords = ["robotics", "mujoco", "onnx", "rl", "simulation", "sim2sim"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/OpenLegged/botlab-python"
Repository = "https://github.com/OpenLegged/botlab-python"

[project.scripts]
botlab = "botlab._cli:main"
botlab-run = "botlab.sdk._runtime.run:main"

[project.optional-dependencies]
# Native headless simulation via `botlab-run`: native MuJoCo physics +
# onnxruntime inference (CPU out of the box; GPU needs onnxruntime-gpu with
# matching CUDA). Without these the CLI still compiles and packages projects.
runtime = [
  "numpy>=1.24",
  "mujoco>=3.2",
  "onnxruntime>=1.18",
  "websockets>=12",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "botlab-python[runtime]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/botlab"]
# The UI snapshot is a gitignored, pruned BotLab runtime snapshot (ui sync
# excludes demo apps plus the built-in templates and shared model catalogs).
# It is force-included by hatch_build.py when present, so fresh clones without
# the snapshot can still install for development and CI; docs/ rides along as
# botlab/docs so local AI agents can read it after pip install.
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "scripts",
  "hatch_build.py",
  "README.md",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  # The vendored SDK mirrors BotLab's browser source; keep its style verbatim.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# The vendored SDK mirrors BotLab's browser source; keep its style verbatim.
"src/botlab/sdk/**" = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = ["e2e: browser end-to-end acceptance tests"]
testpaths = ["tests"]
addopts = ["-q", "-m", "not e2e"]
